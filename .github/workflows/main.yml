
name: Build Yaseen Kirana Store Customer and Admin APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          ZIP_FILE="Yaseen_Kirana_Store_FCM_ANDROID_DIAGNOSTIC_FIX.zip"
          test -f "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          ROOT="extracted/yaseen_android"

          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/java/in/yaseenkirana/store/StoreFirebaseMessagingService.java"
          test -f "$ROOT/app/src/main/res/drawable/splash_background.xml"

      - name: Fix splash logo reference
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted/yaseen_android/app/src/main/res")
          splash = root / "drawable/splash_background.xml"
          text = splash.read_text()

          bad = "@drawable-nodpi/yaseen_store_logo"
          good = "@drawable/yaseen_store_logo"

          if bad in text:
              text = text.replace(bad, good)
              splash.write_text(text)
              print("Splash logo reference fixed.")
          elif good in text:
              print("Splash logo reference already correct.")
          else:
              raise SystemExit("Unexpected splash logo reference. Stopping safely.")

          logos = list(root.glob("drawable*/yaseen_store_logo.*"))
          if not logos:
              raise SystemExit("Yaseen logo file is missing.")
          print("Logo verified:", logos[0])
          PY

      - name: Set Android minimum SDK to 24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/yaseen_android")

          targets = [
              root / "app/build.gradle",
              root / "app/build.gradle.kts",
              root / "app/src/main/AndroidManifest.xml"
          ]

          patterns = [
              (r'(\bminSdk\s*=\s*)23\b', r'\g<1>24'),
              (r'(\bminSdkVersion\s+|minSdkVersion\s*=\s*)23\b', r'\g<1>24'),
              (r'(android:minSdkVersion\s*=\s*["\'])23(["\'])', r'\g<1>24\2')
          ]

          for path in targets:
              if not path.is_file():
                  continue

              content = path.read_text()
              original = content

              for pattern, replacement in patterns:
                  content = re.sub(pattern, replacement, content)

              if content != original:
                  path.write_text(content)
                  print("Updated:", path)

          gradle_file = root / "app/build.gradle"
          content = gradle_file.read_text()

          if re.search(r'\bminSdk(?:Version)?\s*(?:=|\s)\s*23\b', content):
              raise SystemExit("ERROR: minSdk 23 still present.")

          print("Minimum SDK verification passed.")
          PY

      - name: Build Customer and Admin APKs
        run: |
          cd extracted/yaseen_android
          gradle --no-daemon assembleCustomerDebug assembleAdminDebug

      - name: Verify both APKs
        run: |
          test -n "$(find extracted/yaseen_android/app/build/outputs/apk/customer/debug -name '*.apk' -print -quit)"
          test -n "$(find extracted/yaseen_android/app/build/outputs/apk/admin/debug -name '*.apk' -print -quit)"

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yaseen-Kirana-Store-FCM-Customer-and-Admin-APKs
          path: |
            extracted/yaseen_android/app/build/outputs/apk/customer/debug/*.apk
            extracted/yaseen_android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          
