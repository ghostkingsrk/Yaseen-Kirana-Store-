
name: Build Yaseen Kirana Store Customer and Admin APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract FCM diagnostic Android source
        run: |
          ZIP_FILE="Yaseen_Kirana_Store_FCM_ANDROID_DIAGNOSTIC_FIX.zip"
          test -f "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/yaseen_android/app/build.gradle
          test -f extracted/yaseen_android/app/src/main/java/in/yaseenkirana/store/StoreFirebaseMessagingService.java

      - name: Force Android minimum SDK to 24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/yaseen_android")
          changed = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.name not in ("AndroidManifest.xml", "build.gradle", "build.gradle.kts"):
                  continue

              s = p.read_text()
              original = s

              s = re.sub(
                  r'(android:minSdkVersion\s*=\s*["\'])23(["\'])',
                  r'\g<1>24\2',
                  s
              )

              s = re.sub(
                  r'(\bminSdkVersion\s+)(23)\b',
                  r'\g<1>24',
                  s
              )

              s = re.sub(
                  r'(\bminSdk\s*=\s*)(23)\b',
                  r'\g<1>24',
                  s
              )

              if s != original:
                  p.write_text(s)
                  changed.append(str(p))

          print("Files updated:", changed)

          manifest = root / "app/src/main/AndroidManifest.xml"
          content = manifest.read_text()

          if re.search(r'android:minSdkVersion\s*=\s*["\']23["\']', content):
              raise SystemExit("ERROR: Manifest still contains minSdkVersion 23")

          print("Manifest SDK verification passed.")
          PY

      - name: Build Customer and Admin debug APKs
        run: |
          cd extracted/yaseen_android
          gradle assembleCustomerDebug assembleAdminDebug

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yaseen-Kirana-Store-FCM-Customer-and-Admin-APKs
          path: |
            extracted/yaseen_android/app/build/outputs/apk/customer/debug/*.apk
            extracted/yaseen_android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
