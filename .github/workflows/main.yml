
name: Build Yaseen Kirana Store Customer and Admin APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          ZIP_FILE="Yaseen_Kirana_Store_Android_Source_V1.zip"
          test -f "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/yaseen_android/app/build.gradle

      - name: Build Customer and Admin debug APKs
        run: |
          cd extracted/yaseen_android
          gradle assembleCustomerDebug assembleAdminDebug

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yaseen-Kirana-Store-Customer-and-Admin-APKs
          path: |
            extracted/yaseen_android/app/build/outputs/apk/customer/debug/*.apk
            extracted/yaseen_android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
